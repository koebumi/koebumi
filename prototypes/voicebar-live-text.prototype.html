<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- PROTOTYPE（使い捨て）: 録音中の書き起こしの見せ方を 5 案で比べる。← → か下の矢印で切り替える。本体のコードではない -->
<style>
  body { margin: 0; font-family: var(--font-sans, -apple-system, "Hiragino Sans", sans-serif); color: var(--foreground, #e8e8ec); }
  .wrap { display: flex; flex-direction: column; gap: 14px; }
  .lead { font-size: 13px; line-height: 1.7; color: var(--muted-foreground, #a0a0aa); margin: 0; }
  .lead b { color: var(--foreground, #e8e8ec); font-weight: 600; }

  /* ---- 画面の見本 ---- */
  .stage { position: relative; height: 450px; border-radius: var(--radius, 12px); overflow: hidden;
    background: linear-gradient(115deg, #6489e8 0%, #8f7be6 46%, #d99db6 100%);
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif; }
  .win { position: absolute; left: 50%; top: 22px; transform: translateX(-50%); width: 540px; height: 214px; border-radius: 12px;
    background: #1e1f25; box-shadow: 0 18px 40px rgba(0,0,0,.33), inset 0 0 0 .5px rgba(255,255,255,.14); overflow: hidden; }
  .titlebar { height: 30px; display: flex; align-items: center; gap: 7px; padding: 0 12px; background: #2a2b32; color: #b6b7c0; font-size: 12px; }
  .light { width: 11px; height: 11px; border-radius: 50%; }
  .title { flex: 1; text-align: center; margin-right: 46px; }
  .doc { padding: 14px 18px; color: #e9e9ee; font-size: 13.5px; line-height: 1.8; white-space: pre-wrap; }
  .ghost { color: rgba(233,233,238,.42); }
  .ghost.busy { animation: shimmer 1.1s ease-in-out infinite; }
  .caret { display: inline-block; width: 1.5px; height: 1.15em; background: #8ab4ff; vertical-align: -0.2em; margin-left: 1px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes shimmer { 50% { color: rgba(233,233,238,.22); } }

  .glass { background: rgba(36,38,46,.70); -webkit-backdrop-filter: blur(18px) saturate(1.5); backdrop-filter: blur(18px) saturate(1.5);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.20), inset 0 0 0 1px rgba(255,255,255,.10), 0 8px 26px rgba(0,0,0,.22); color: #f3f3f6; }
  .hidden { opacity: 0 !important; pointer-events: none; }

  .bar { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); height: 42px; border-radius: 21px; display: flex; align-items: center;
    gap: 13px; padding: 0 24px 0 7px; transition: opacity .18s; box-sizing: border-box; }
  .badge { width: 30px; height: 30px; border-radius: 50%; background: #f4f4f6; display: grid; place-items: center; flex: none; }
  .waves { width: 104px; height: 42px; display: flex; align-items: center; justify-content: center; gap: 6px; flex: none; transition: width .25s; }
  .waves i { width: 3px; border-radius: 2px; background: #fff; display: block; }
  .dots { display: none; gap: 7px; align-items: center; justify-content: center; width: 104px; flex: none; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: #fff; display: block; animation: bob 0.9s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes bob { 50% { transform: translateY(-5px); opacity: .6; } }
  .bar.processing .waves { display: none; } .bar.processing .dots { display: flex; }
  /* B: バーの中に 1 行 */
  .tick { display: none; width: 290px; overflow: hidden; white-space: nowrap; font-size: 13px; color: #f3f3f6;
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 34px); mask-image: linear-gradient(to right, transparent 0, #000 34px); }
  .tick span { float: right; }
  .bar.wide .tick { display: block; } .bar.wide .waves, .bar.wide .dots { width: 58px; } .bar.wide .waves { gap: 3px; }
  .bar.wide { padding-right: 16px; } .bar.wide.processing .tick { opacity: .55; }

  /* A: バーの上の札 */
  .card { position: absolute; left: 50%; bottom: 68px; transform: translateX(-50%); width: max-content; max-width: 380px; padding: 9px 16px;
    border-radius: 21px; font-size: 13px; line-height: 1.5; transition: opacity .18s; box-sizing: border-box; }
  /* D: 字幕 */
  .caption { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 30px 70px; text-align: center; color: #fff; transition: opacity .18s;
    background: linear-gradient(to top, rgba(8,8,14,.62) 0%, rgba(8,8,14,.42) 55%, transparent 100%);
    text-shadow: 0 0 2px rgba(0,0,0,.8), 0 1px 6px rgba(0,0,0,.55); }
  .caption .prev { font-size: 13px; opacity: .75; margin-bottom: 4px; }
  .caption .now { font-size: 20px; font-weight: 600; line-height: 1.45; }
  .unstable { color: rgba(255,255,255,.62); text-decoration: underline dotted rgba(255,255,255,.6); text-underline-offset: 5px; }
  /* E: 整形の前後まで見せるパネル */
  .panel { position: absolute; left: 50%; bottom: 68px; transform: translateX(-50%); width: 480px; padding: 11px 16px 12px; border-radius: 18px;
    font-size: 13px; line-height: 1.65; transition: opacity .18s; box-sizing: border-box; }
  .panel .head { font-size: 11px; letter-spacing: .04em; color: rgba(243,243,246,.62); margin-bottom: 4px; display: flex; justify-content: space-between; }
  .panel .body { max-height: 88px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
  .panel .unstable { color: rgba(255,255,255,.5); }
  .del { text-decoration: line-through; color: rgba(255,150,150,.85); }
  .ins { background: rgba(120,200,255,.28); border-radius: 3px; }

  /* ---- 操作 ---- */
  .controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .switcher { display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 999px; background: var(--foreground, #e8e8ec); color: var(--background, #111); box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  .switcher button { border: 0; background: transparent; color: inherit; width: 30px; height: 30px; border-radius: 50%; font-size: 15px; cursor: pointer; }
  .switcher button:hover { background: rgba(127,127,127,.2); }
  .switcher .label { font-size: 13px; font-weight: 600; padding: 0 8px; min-width: 250px; text-align: center; }
  .playback { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted-foreground, #a0a0aa); }
  .playback button { border: 1px solid var(--border, #333); background: var(--secondary, #222); color: var(--secondary-foreground, #ddd); border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
  .playback input { width: 150px; accent-color: var(--primary, #8ab4ff); }
  .time { font-family: var(--font-mono, ui-monospace, monospace); min-width: 72px; }

  .info { background: var(--card, #1a1a1f); color: var(--card-foreground, #e8e8ec); border: 1px solid var(--border, #2c2c33); border-radius: var(--radius, 12px); padding: 16px; }
  .info h3 { margin: 0 0 4px; font-size: 15px; }
  .info .what { margin: 0 0 12px; font-size: 13px; line-height: 1.7; color: var(--muted-foreground, #a0a0aa); }
  .info dl { display: grid; grid-template-columns: 72px 1fr; gap: 6px 12px; margin: 0; font-size: 13px; line-height: 1.65; }
  .info dt { color: var(--muted-foreground, #a0a0aa); }
  .info dd { margin: 0; }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border, #2c2c33); vertical-align: top; line-height: 1.55; }
  th { font-weight: 600; color: var(--muted-foreground, #a0a0aa); }
  tr.current td { background: color-mix(in srgb, var(--primary, #8ab4ff) 16%, transparent); }
  td:first-child { white-space: nowrap; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <p class="lead"><b>録音中の書き起こしの見せ方、5 案。</b> 文字が出る時刻と文は、Qwen3-ASR 0.6B に 15 秒の読み上げを実際の速さで流したときの実測です（「大主 → 大衆 → 来週」と途中で直る様子も実際のもの）。← → キーか下の矢印で案を切り替え、つまみで同じ時点を見比べられます。</p>

  <div class="stage" id="stage">
    <div class="win">
      <div class="titlebar"><span class="light" style="background:#ff5f57"></span><span class="light" style="background:#febc2e"></span><span class="light" style="background:#28c840"></span><span class="title">メモ — 定例の準備</span></div>
      <div class="doc" id="doc"></div>
    </div>
    <div class="panel glass hidden" id="panel"><div class="head"><span id="panelState"></span><span id="panelHint"></span></div><div class="body"><div id="panelText"></div></div></div>
    <div class="card glass hidden" id="card"></div>
    <div class="caption hidden" id="caption"><div class="prev" id="capPrev"></div><div class="now" id="capNow"></div></div>
    <div class="bar glass hidden" id="bar">
      <div class="badge"><svg width="13" height="17" viewBox="0 0 13 17" fill="none"><rect x="3.5" y="0.8" width="6" height="10" rx="3" fill="#15161b"/><path d="M1.2 7.6a5.3 5.3 0 0 0 10.6 0" stroke="#15161b" stroke-width="1.6" stroke-linecap="round"/><path d="M6.5 13v3" stroke="#15161b" stroke-width="1.6" stroke-linecap="round"/></svg></div>
      <div class="waves" id="waves"></div>
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="tick" id="tick"><span id="tickText"></span></div>
    </div>
  </div>

  <div class="controls">
    <div class="switcher"><button id="prevV" aria-label="前の案">‹</button><span class="label" id="vLabel"></span><button id="nextV" aria-label="次の案">›</button></div>
    <div class="playback">
      <button id="restart">最初から</button>
      <button id="speed">1×</button>
      <input type="range" id="scrub" min="-0.8" max="21.5" step="0.05" aria-label="時刻">
      <span class="time" id="time"></span>
    </div>
  </div>

  <div class="info" id="info"></div>

  <table>
    <thead><tr><th>案</th><th>目線</th><th>画面を覆う広さ</th><th>どこがまだ変わるか</th><th>作る手間</th></tr></thead>
    <tbody id="summary"></tbody>
  </table>
</div>

<script>
// 実測した途中の書き起こし（秒, 文）。録音は 15.45 秒で終わる
const PREVIEWS = [
  [1.57, "明日の会議。"],
  [2.74, "明日の会議なんですけど、資料は。"],
  [3.79, "明日の会議なんですけど、資料はまだできていない。"],
  [4.86, "明日の会議なんですけど、資料はまだできていないので先に。"],
  [6.03, "明日の会議なんですけど、資料はまだできていないので、先に議題だけ共有。"],
  [7.23, "明日の会議なんですけど、資料はまだできていないので、先に議題だけ共有しておきます。"],
  [8.55, "明日の会議なんですけど、資料はまだできていないので、先に議題だけ共有しておきます。それと、大主。"],
  [9.97, "明日の会議なんですけど、資料はまだできていないので、先に議題だけ共有しておきます。それと、大衆の打ち合わせの日。"],
  [11.48, "明日の会議なんですけど、資料はまだできていないので、先に議題だけ共有しておきます。それと、来週の打ち合わせの日程も決めたいので。"],
  [13.18, "明日の会議なんですけど、資料はまだできていないので、先に議題だけ共有しておきます。それと、来週の打ち合わせの日程も決めたいので、候補を三つくらい。"],
  [15.05, "明日の会議なんですけど、資料はまだできていないので、先に議題だけ共有しておきます。それと、来週の打ち合わせの日程も決めたいので、候補を三つくらい出してもらえますかよろし。"],
];
const END = 15.45, RAW_AT = END + 1.0, DONE = RAW_AT + 1.4, LOOP = 21.5, START = -0.8;
const RAW = "明日の会議なんですけど、資料はまだできていないので、先に議題だけ共有しておきます。それと、来週の打ち合わせの日程も決めたいので、候補を三つくらい出してもらえますかよろしくお願いします。";
const POLISHED = "明日の会議ですが、資料がまだできていないので、先に議題だけ共有しておきます。それと、来週の打ち合わせの日程も決めたいので、候補を3つくらい出してもらえますか。よろしくお願いします。";
const BEFORE = "11/27 定例の準備\n";

const VARIANTS = [
  { key: "A", name: "今の実装：バーの上の札",
    what: "バーの上にガラスの札を出し、最後の 2 行（日本語で 50 字）までを表示する。長くなったら先頭を「…」で省く。",
    good: "実装済み。どのアプリでも同じ場所に出る。バーの幅と位置は変わらない。",
    bad: "目線が入力欄と画面の下を行き来する。どこがまだ変わりうるかはわからない。",
    cost: "0（今の実装）",
    row: ["画面の下", "小（2 行）", "わからない", "0"] },
  { key: "B", name: "バーの中に 1 行で流す",
    what: "録音中はバーを横に伸ばし、波形の右に最新の 1 行を流す。左端はぼかして消す。",
    good: "画面に出るものが 1 つだけで、いちばん控えめ。作業の邪魔になりにくい。",
    bad: "見えるのは 20 字ほど。言い直しで前の語が直っても見えない。バーの幅が変わる。",
    cost: "半日ほど（バーの幅の動きと、左端のぼかし）",
    row: ["画面の下", "最小（1 行）", "わからない", "半日"] },
  { key: "C", name: "カーソルの位置に薄い文字",
    what: "入力欄のカーソルの後ろに、書き起こしを薄い文字で重ねる。話し終えると、整えた文に置き換わる。",
    good: "目線が入力欄から動かない。日本語入力の変換中の文字と同じ感覚で、入る場所もわかる。",
    bad: "カーソルの位置をアクセシビリティ API で読めないアプリ（端末、一部の Web ページ）では出せず、A に戻す必要がある。整形で文が大きく変わると、置き換わる瞬間に文字が跳ねる。",
    cost: "2〜3 日（カーソルの位置の取得、入力欄に重ねる透明なパネル、読めないアプリの見分け）",
    row: ["入力欄", "なし（入力欄の中）", "わからない", "2〜3 日"] },
  { key: "D", name: "字幕：いまの 1 文を大きく",
    what: "背景なしの大きな文字で、いま話している 1 文だけを出す。前の書き起こしから変わった部分は薄くして点線を引く。1 つ前の文は小さく上に残す。",
    good: "離れていても読める。どこがまだ変わりうるかがわかる（「大主 → 大衆 → 来週」の部分）。",
    bad: "前の文はほとんど見えない。白い画面の上では読みにくく、影に頼る。",
    cost: "1 日ほど（文の区切りと、前の書き起こしとの差の見分け）",
    row: ["画面の下", "中（2 行・枠なし）", "わかる", "1 日"] },
  { key: "E", name: "整形の前後まで見せるパネル",
    what: "大きめのパネルに全文を出す。話し終えると、AI が消した語に取り消し線、足した語に色を付けて 1 秒ほど見せてから入力する。",
    good: "聞き間違いと AI の直しの両方を、入力する前に確かめられる。履歴の「AI の変更の表示」と同じ見せ方なので覚えることがない。",
    bad: "画面を大きく覆う。直しを見せる間だけ入力が遅れる。短い発話には大げさ。",
    cost: "1〜2 日（履歴の差分の表示を使い回す）",
    row: ["画面の下", "大（4 行のパネル）", "わかる", "1〜2 日"] },
];

const $ = id => document.getElementById(id);
let vi = 0, t = START, speed = 1, last = performance.now(), scrubbing = false;

// 波形の 9 本
for (let i = 0; i < 9; i++) $("waves").appendChild(document.createElement("i"));
const bars = [...$("waves").children];
const heights = new Array(9).fill(4);

function previewIndex(time) {
  let i = -1;
  for (let k = 0; k < PREVIEWS.length; k++) if (PREVIEWS[k][0] <= time) i = k;
  return i;
}
function commonPrefix(a, b) { let n = 0; while (n < a.length && n < b.length && a[n] === b[n]) n++; return n; }
function esc(s) { return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]); }
/** 前の書き起こしと同じ先頭は濃く、変わった後ろは薄く */
function stability(i, from = 0) {
  const now = PREVIEWS[i][1];
  const prev = i > 0 ? PREVIEWS[i - 1][1] : "";
  const keep = Math.max(commonPrefix(prev, now), from);
  return esc(now.slice(from, keep)) + `<span class="unstable">${esc(now.slice(keep))}</span>`;
}
/** 今の実装と同じ切り方：全角 2・半角 1 と数えて 100 まで */
function tail(text, limit = 100) {
  const w = c => (c.charCodeAt(0) < 128 ? 1 : 2);
  const chars = [...text];
  if (chars.reduce((s, c) => s + w(c), 0) <= limit) return text;
  let used = 2, start = chars.length;
  while (start > 0 && used + w(chars[start - 1]) <= limit) { used += w(chars[start - 1]); start--; }
  return "…" + chars.slice(start).join("");
}
function diffHTML(a, b) {
  const n = a.length, m = b.length;
  const dp = Array.from({ length: n + 1 }, () => new Int16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const parts = []; const push = (k, c) => { const p = parts[parts.length - 1]; if (p && p.k === k) p.s += c; else parts.push({ k, s: c }); };
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) { push("eq", a[i]); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) push("del", a[i++]);
    else push("ins", b[j++]);
  }
  while (i < n) push("del", a[i++]); while (j < m) push("ins", b[j++]);
  return parts.map(p => p.k === "eq" ? esc(p.s) : `<span class="${p.k}">${esc(p.s)}</span>`).join("");
}
const DIFF = diffHTML(RAW, POLISHED);

/** 文の区切り（。）で分け、いまの 1 文と 1 つ前の文を返す */
function sentences(text) {
  const parts = text.match(/[^。]+。?/g) || [];
  return { now: parts[parts.length - 1] || "", prev: parts[parts.length - 2] || "", nowStart: text.length - (parts[parts.length - 1] || "").length };
}

function set(el, html) { if (el._html !== html) { el.innerHTML = html; el._html = html; } }
function show(el, on) { el.classList.toggle("hidden", !on); }

function render() {
  const v = VARIANTS[vi].key;
  const recording = t >= 0 && t < END, finishing = t >= END && t < RAW_AT, polishing = t >= RAW_AT && t < DONE;
  const processing = finishing || polishing, active = recording || processing, done = t >= DONE;
  const i = previewIndex(Math.min(t, END));
  const partial = i >= 0 ? PREVIEWS[i][1] : "";

  // 入力欄
  let doc = esc(BEFORE);
  if (done) doc += esc(POLISHED) + '<span class="caret"></span>';
  else if (v === "C" && active && partial) doc += '<span class="caret"></span>' + `<span class="ghost${processing ? " busy" : ""}">${esc(partial)}</span>`;
  else doc += '<span class="caret"></span>';
  set($("doc"), doc);

  // バー
  const bar = $("bar");
  show(bar, active);
  bar.classList.toggle("processing", processing);
  bar.classList.toggle("wide", v === "B" && active);
  set($("tickText"), esc(partial));

  // A
  show($("card"), v === "A" && active && !!partial);
  set($("card"), esc(tail(partial)));

  // D
  show($("caption"), v === "D" && active && !!partial);
  if (i >= 0) {
    const s = sentences(partial);
    set($("capPrev"), esc(s.prev));
    set($("capNow"), stability(i, s.nowStart));
  }

  // E
  show($("panel"), v === "E" && active && !!partial);
  if (polishing) {
    set($("panelState"), "AI で整えています");
    set($("panelHint"), "取り消し線: 消した語　色: 足した語");
    set($("panelText"), DIFF);
  } else if (i >= 0) {
    set($("panelState"), finishing ? "書き起こしを仕上げています" : "聞き取っています");
    set($("panelHint"), "薄い字: まだ変わるかもしれない部分");
    set($("panelText"), stability(i));
  }

  $("time").textContent = (t < 0 ? "待機" : t < END ? "録音 " + t.toFixed(1) + "s" : t < DONE ? "処理中" : "入力済み");
  if (!scrubbing) $("scrub").value = t;
}

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  if (!scrubbing) { t += dt * speed; if (t > LOOP) t = START; }
  // 声の大きさ：話している間は揺らし、7.0〜7.4 秒の息継ぎと終わりは小さく
  const speaking = t > 0.25 && t < END - 0.2 && !(t > 7.0 && t < 7.4);
  bars.forEach((b, k) => {
    const target = speaking ? 6 + Math.abs(Math.sin(now / 140 + k * 1.7) * Math.sin(now / 330 + k)) * 22 : 4;
    heights[k] += (target - heights[k]) * 0.25;
    b.style.height = heights[k].toFixed(1) + "px";
  });
  render();
  requestAnimationFrame(frame);
}

function selectVariant(k) {
  vi = (k + VARIANTS.length) % VARIANTS.length;
  const v = VARIANTS[vi];
  $("vLabel").textContent = `${v.key}　${v.name}`;
  $("info").innerHTML = `<h3>${v.key}　${v.name}</h3><p class="what">${v.what}</p><dl><dt>良い点</dt><dd>${v.good}</dd><dt>気になる点</dt><dd>${v.bad}</dd><dt>作る手間</dt><dd>${v.cost}</dd></dl>`;
  $("summary").innerHTML = VARIANTS.map((x, n) => `<tr class="${n === vi ? "current" : ""}"><td>${x.key}　${x.name}</td>${x.row.map(c => `<td>${c}</td>`).join("")}</tr>`).join("");
  [...$("summary").children].forEach((tr, n) => { tr.style.cursor = "pointer"; tr.onclick = () => selectVariant(n); });
}

$("prevV").onclick = () => selectVariant(vi - 1);
$("nextV").onclick = () => selectVariant(vi + 1);
$("restart").onclick = () => { t = START; };
$("speed").onclick = () => { speed = speed === 1 ? 2 : speed === 2 ? 0.5 : 1; $("speed").textContent = speed + "×"; };
$("scrub").oninput = e => { scrubbing = true; t = parseFloat(e.target.value); render(); };
$("scrub").onchange = () => { scrubbing = false; };
document.addEventListener("keydown", e => {
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA" || document.activeElement.isContentEditable) return;
  if (e.key === "ArrowLeft") selectVariant(vi - 1);
  if (e.key === "ArrowRight") selectVariant(vi + 1);
});

// 単体で開いたとき（テーマの色がないとき）だけ、暗い背景にする
if (!getComputedStyle(document.documentElement).getPropertyValue("--background").trim()) {
  document.body.style.background = "#121216"; document.body.style.padding = "20px";
}
// #v=C&t=12&freeze で、案と時刻を指定して開く（freeze で止める）
const hash = new URLSearchParams(location.hash.slice(1));
selectVariant(Math.max(0, VARIANTS.findIndex(x => x.key === (hash.get("v") || "A"))));
if (hash.has("t")) t = parseFloat(hash.get("t"));
if (hash.has("freeze")) scrubbing = true;
requestAnimationFrame(frame);
</script>
</body>
</html>
